<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de entrenadores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecera">
        <h1>Portal de entrenadores</h1>
        <p id="estado-api" class="estado">Comprobando la API…</p>
    </header>

    <main>
        <p id="aviso" class="aviso" role="status" hidden></p>

        <!-- Sin sesión -->
        <section id="vista-acceso" hidden>
            <div class="pestanas" role="tablist">
                <button type="button" id="pestana-login" class="pestana activa" role="tab" aria-selected="true">Entrar</button>
                <button type="button" id="pestana-registro" class="pestana" role="tab" aria-selected="false">Crear cuenta</button>
            </div>

            <form id="form-login" class="tarjeta" novalidate>
                <label>
                    Email
                    <input type="email" name="email" autocomplete="username" required>
                </label>
                <label>
                    Contraseña
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="principal">Entrar</button>
            </form>

            <form id="form-registro" class="tarjeta" novalidate hidden>
                <label>
                    Nombre
                    <input type="text" name="nombre" autocomplete="name" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>
                    Contraseña
                    <input type="password" name="password" autocomplete="new-password" minlength="8" required>
                    <small>Mínimo 8 caracteres.</small>
                </label>
                <label>
                    Repite la contraseña
                    <input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" required>
                </label>
                <button type="submit" class="principal">Crear cuenta</button>
                <p class="nota">Un administrador tendrá que aprobar tu cuenta antes de que puedas entrar.</p>
            </form>
        </section>

        <!-- Con sesión -->
        <section id="vista-sesion" hidden>
            <div class="tarjeta">
                <div class="fila-titulo">
                    <h2>Mi cuenta</h2>
                    <button type="button" id="boton-salir">Cerrar sesión</button>
                </div>
                <dl class="datos">
                    <dt>Nombre</dt>
                    <dd id="dato-nombre"></dd>
                    <dt>Email</dt>
                    <dd id="dato-email"></dd>
                    <dt>Rol</dt>
                    <dd id="dato-rol"></dd>
                </dl>
            </div>

            <div class="tarjeta">
                <div class="fila-titulo">
                    <h2>Publicaciones</h2>
                    <button type="button" id="boton-nueva">Nueva publicación</button>
                </div>

                <form id="form-post" class="form-post" novalidate hidden>
                    <h3 id="titulo-form-post">Nueva publicación</h3>
                    <label>
                        Título
                        <input type="text" name="titulo" maxlength="255" required>
                    </label>
                    <div class="dos-columnas">
                        <label>
                            Tipo
                            <select name="tipo" id="post-tipo" required></select>
                        </label>
                        <label>
                            Quién puede verla
                            <select name="visibilidad" id="post-visibilidad"></select>
                        </label>
                    </div>
                    <div class="dos-columnas">
                        <label>
                            Equipo
                            <select name="team_id" id="post-equipo"></select>
                        </label>
                        <label>
                            Temporada
                            <input type="text" name="temporada" maxlength="20" placeholder="2026-27">
                        </label>
                    </div>
                    <label>
                        Contenido
                        <textarea name="contenido" rows="5"></textarea>
                    </label>
                    <label>
                        Archivos
                        <input type="file" name="archivos" multiple accept=".jpg,.jpeg,.png,.webp,.pdf">
                        <small>Imágenes (JPG, PNG o WebP) o PDF, hasta 10 MB cada uno. Máximo 10 adjuntos por publicación.</small>
                    </label>
                    <label>
                        Enlace de YouTube
                        <input type="url" name="enlace" placeholder="https://www.youtube.com/watch?v=…">
                    </label>
                    <div class="botones">
                        <button type="submit" class="principal" id="boton-guardar-post">Publicar</button>
                        <button type="button" id="boton-cancelar-post">Cancelar</button>
                    </div>
                </form>

                <div class="filtros">
                    <select id="filtro-tipo" aria-label="Filtrar por tipo"></select>
                    <input type="search" id="filtro-q" placeholder="Buscar por título" aria-label="Buscar por título">
                </div>

                <div id="lista-posts"></div>
                <p id="sin-posts" class="nota" hidden>No hay publicaciones.</p>
                <p id="mas-posts" class="nota" hidden></p>
            </div>

            <div id="panel-admin" class="tarjeta" hidden>
                <div class="fila-titulo">
                    <h2>Usuarios</h2>
                    <label class="filtro">
                        Mostrar
                        <select id="filtro-usuarios">
                            <option value="0">Pendientes o desactivados</option>
                            <option value="1">Activos</option>
                            <option value="">Todos</option>
                        </select>
                    </label>
                </div>
                <div class="tabla-contenedor">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="lista-usuarios"></tbody>
                    </table>
                </div>
                <p id="sin-usuarios" class="nota" hidden>No hay usuarios en esta lista.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
